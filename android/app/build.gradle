plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace "com.sync.clipsync"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.sync.clipsync"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true

        // Ship only phone ABIs. x86_64/x86 are emulator-only and roughly double
        // the APK size for real users. arm64-v8a + armeabi-v7a cover all phones.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    // Strip emulator-only ABIs (x86_64/x86) from the fat APK package.
    // Real phones only need arm64-v8a / armeabi-v7a — this removes ~140 MB.
    packagingOptions {
        resources {
            excludes += ["/lib/x86_64/**", "/lib/x86/**"]
        }
        jniLibs {
            excludes += ["lib/x86_64/*.so", "lib/x86/*.so"]
            // The app runs llama.cpp in CPU-only mode (gpuLayers: 0), so the
            // GPU/Vulkan/WebGPU accelerator libraries are dead weight.
            excludes += [
                "lib/*/libggml-vulkan.so",
                "lib/*/libwebgpu_dawn.so",
                "lib/*/libVkLayer_khronos_validation.so",
                "lib/*/libLiteRtGpuAccelerator.so",
                "lib/*/libLiteRtOpenClAccelerator.so",
            ]
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "com.google.mlkit:text-recognition:16.0.0"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.0"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
}
