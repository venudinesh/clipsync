plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.sync.clipsync"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.sync.clipsync"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true

        // Only arm64 phones carry the llama.cpp runtime. A 32-bit APK used to
        // install and then fail at model load with UnsatisfiedLinkError.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // A real release key comes from android/key.properties (gitignored).
            // Without one, local builds fall back to the debug key rather than
            // failing; Play will reject a debug-signed upload.
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    // Strip emulator-only ABIs (x86_64/x86) from the fat APK package.
    // Real phones only need arm64-v8a / armeabi-v7a — this removes ~140 MB.
    packagingOptions {
        resources {
            excludes += ["/lib/x86_64/**", "/lib/x86/**"]
        }
        jniLibs {
            // Flutter's target platforms and plugin AARs can reintroduce 32-bit
            // libraries even with an arm64 abiFilter. Strip them so the APK
            // cannot install on a phone that has no llama.cpp runtime.
            excludes += ["lib/armeabi-v7a/**", "lib/x86/**", "lib/x86_64/**"]
            excludes += ["lib/x86_64/*.so", "lib/x86/*.so"]
            // The app runs llama.cpp in CPU-only mode (gpuLayers: 0), so the
            // GPU/Vulkan/WebGPU accelerator libraries are dead weight.
            excludes += [
                "lib/*/libggml-vulkan.so",
                "lib/*/libwebgpu_dawn.so",
                "lib/*/libVkLayer_khronos_validation.so",
                "lib/*/libLiteRt*.so",
            ]
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "com.google.mlkit:text-recognition:16.0.0"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.0"
}
