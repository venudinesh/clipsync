name: clip_sync_ai
description: >
  ClipSyncAI - offline-first, privacy-first clipboard processing with on-device LLM inference.
  Liquid Glass AMOLED dark mode UI. Runs llama.cpp directly in-app — no server needed.
publish_to: 'none'
version: 1.1.1+2

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # On-device LLM inference via llama.cpp (the same engine Ollama uses)
  llamadart: ^0.8.21

  # Local database. hive_ce is the maintained fork of Hive 2 and reads the
  # same box format, so existing encrypted boxes keep opening.
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0

  # Secure storage for encryption keys. Stay on 10.x: v11 removed the
  # migration from v9's EncryptedSharedPreferences store, so jumping straight
  # to it would orphan every key already on a device. v10 migrates on first
  # access; a later release can move 10 -> 11 once that has happened.
  flutter_secure_storage: ^9.2.4

  # Path utilities
  path_provider: ^2.1.6

  # Device info for hardware-aware model selection
  device_info_plus: ^12.4.0

  # Permission handling
  permission_handler: ^12.0.3

  # Markdown rendering
  flutter_markdown_plus: ^1.0.12

  # On-device OCR
  google_mlkit_text_recognition: ^0.13.0

  # Image picking for OCR
  image_picker: ^1.2.4

  # File picking for chat attachments (docs, audio, etc.)
  file_picker: ^11.0.3

  # UUID generation
  uuid: ^4.3.3

  # Date formatting
  intl: ^0.20.3

  # URL launcher for links
  url_launcher: ^6.3.3

  # Shimmer effects
  shimmer: ^4.0.0

  # Local audio recording for voice notes
  record: ^7.1.2

  # On-device speech-to-text via Whisper.cpp
  whisper_flutter_new: ^1.0.1

  # Biometric unlock (fingerprint / face) for the app lock screen.
  # Android + macOS only; Linux and desktop fall back to the PIN.
  local_auth: ^3.0.2

  # File downloading for GGUF model acquisition
  http: ^1.2.1

  # Launch clip playback (Android/iOS/macOS; other platforms fall back to skip)
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# url_launcher_macos and record_macos ship broken SwiftPM manifests for macOS
# (FlutterMacOS module can't resolve). Vendored copies strip the Package.swift
# so the Flutter tool routes them through the CocoaPods path instead.
dependency_overrides:
  url_launcher_macos:
    path: third_party/url_launcher_macos
  record_macos:
    path: third_party/record_macos

flutter:
  uses-material-design: true
  assets:
    - assets/video/intro_phone.mp4
    - assets/video/intro_pc.mp4
  config:
    enable-swift-package-manager: false
